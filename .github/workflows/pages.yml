name: Deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 8 * * 1-5" # weekdays, after the Tokyo close (UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - name: Fetch live data (falls back to the sample, which the UI flags)
        run: python fetcher/fetch_data.py || (echo "::warning::live fetch failed, using sample data" && python fetcher/fetch_data.py --sample)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
